name: TOW legacy sale verification
on:
  pull_request:
    paths:
      - 'scripts/verify_tow_legacy_sales.py'
      - '.github/workflows/tow-legacy-sale-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify only two sale hashes
        run: python3 scripts/verify_tow_legacy_sales.py
      - name: Upload review-only sale metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tow-legacy-sale-verification
          path: tow-legacy-sale-verification.json
          if-no-files-found: warn
