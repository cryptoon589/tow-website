name: Proof Of Tiredness Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scan-wallets:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger wallet scan
        run: |
          curl -X POST "${{ secrets.TOW_WEBSITE_URL }}/api/tired-scan-all" \
            -H "Content-Type: application/json" \
            -H "x-tow-sync-secret: ${{ secrets.TOW_SYNC_SECRET }}" \
            -d '{"limit":50,"maxWallets":50}'
