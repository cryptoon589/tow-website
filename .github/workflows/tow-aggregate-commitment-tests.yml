name: TOW aggregate commitment unit tests
on:
  pull_request:
    paths:
      - 'scripts/reconcile_tow_aggregate_commitments.py'
      - 'tests/test_tow_aggregate_commitments.py'
      - '.github/workflows/tow-aggregate-commitment-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated aggregate reconciliation tests
        run: python3 -m unittest discover -s tests -p 'test_tow_aggregate_commitments.py' -v
